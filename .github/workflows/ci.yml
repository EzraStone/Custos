name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./controlplane[api]" -e ./a0 pytest ruff httpx
      - name: Lint
        run: ruff check controlplane a0
      - name: Test control plane
        run: cd controlplane && pytest -q
      - name: Test A0
        run: cd a0 && pytest -q

  gate:
    # The G0 gate runs in CI and fails the build if the signal stops
    # separating. It is the one result the whole company is contingent on, so
    # it is not allowed to regress quietly between commits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./controlplane -e ./a0
      - name: Run the A0 experiment
        run: python -m custos_a0.cli experiment
      - name: Stress corpus
        # Informational in the log, enforced by tests. The margin here is the
        # number that belongs in diligence, and printing it on every build
        # means a change that narrows it is visible rather than buried.
        run: python -m custos_a0.cli stress

  contract:
    # The Python schema and the Go wire types describe the same bytes and
    # cannot share a definition. Drift between them is silent — a field the API
    # ignores looks exactly like a field the collector never sent — so the
    # contract test runs on its own and blocks the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./controlplane[api]" pytest
      - name: Wire contract
        run: cd controlplane && pytest -q tests/test_wire_contract.py

  invariants:
    # SEC-16 through SEC-20 have named tests. They run as their own job so a
    # failure reads as "an invariant broke" in the checks list rather than
    # being one line inside a suite of two hundred.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: pip install -e "./controlplane[api]" -e ./a0 pytest
      - name: SEC-16, SEC-18, SEC-19 (collector)
        run: |
          cd collector
          go test ./internal/wire/ ./internal/awsread/ ./internal/config/             -run 'TestWireTypesCarryNoPayload|TestNoPayloadShapedFieldNames|TestNoMutatingAPIs|TestStartQuery|TestEveryAWSMethodIsReadOnly|TestZeroConfigIsInert' -v
      - name: SEC-17, SEC-18, SEC-20 (control plane)
        run: |
          cd controlplane
          pytest -q -k "sec17 or sec18 or sec20 or leakage or unattributed"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format
        run: cd collector && test -z "$(gofmt -l .)"
      - name: Vet
        run: cd collector && go vet ./...
      - name: Test
        run: cd collector && go test -race ./...
      - name: Image builds
        run: docker build -f deploy/Dockerfile -t custos-controlplane:ci .
      - name: Build
        run: cd collector && CGO_ENABLED=0 go build -trimpath ./cmd/custos-collector

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform -chdir=collector/deploy/terraform fmt -check
      - name: Validate
        run: |
          terraform -chdir=collector/deploy/terraform init -backend=false
          terraform -chdir=collector/deploy/terraform validate
