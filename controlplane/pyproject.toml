[project]
name = "custos"
version = "0.1.0"
description = "Custos control plane: classifier, register, attribution, reach."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
custos = "custos.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custos*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
